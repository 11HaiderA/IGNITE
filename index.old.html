<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e11d2a">
  <title>MATCHSTICKS — Ignite Your Mind</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./assets/icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rubik+Burned&display=swap" rel="stylesheet">

  <!-- Style Sheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/popups.css">
</head>
<body>
  <!-- Ember Particles Canvas -->
  <canvas id="emberCanvas"></canvas>

  <!-- Film Grain Overlay -->
  <div class="film-grain"></div>

  <!-- Primary Application Frame -->
  <div id="app"></div>

  <!-- Modal / Overlay Container -->
  <div id="modalLayer"></div>

  <!-- Main Game Entry -->
  <script type="module" src="js/main.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
